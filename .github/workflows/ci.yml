name: Next.js CI (Build & Test)

# কখন এই ওয়ার্কফ্লো রান করবে? (main ব্রাঞ্চে পুশ বা পুল রিকোয়েস্ট করলে)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. GitHub থেকে কোড চেকআউট করবে
      - name: Checkout Code
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করবে
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # আপনার প্রজেক্টের নোড ভার্সন
          cache: 'npm'       # দ্রুত ইনস্টলের জন্য npm ক্যাশ ব্যবহার

      # ৩. ডিপেন্ডেন্সি (প্যাকেজ) ইনস্টল করবে
      - name: Install Dependencies
        run: npm ci # CI পরিবেশে 'npm ci' ব্যবহার করা ভালো (এটি package-lock.json হুবহু মেনে চলে)

      # ৪. Next.js বিল্ড ক্যাশ করা (প্রোডাকশন লেভেল স্পিডের জন্য)
      - name: Setup Next.js Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # ৫. কোড লিন্টিং চেক করবে (ভুল ফরম্যাট থাকলে ধরবে)
      - name: Run Linting
        run: npm run lint

      # ৬. টেস্ট রান করবে (যদি প্রজেক্টে Jest বা Cypress থাকে)
      # - name: Run Tests
      #   run: npm test

      # ৭. প্রোডাকশন বিল্ড তৈরি করবে
      - name: Build Next.js App
        run: npm run build
